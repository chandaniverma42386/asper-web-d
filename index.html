<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASPER Login</title>
</head>

<body>

    <main>

        <h1>ASPER</h1>
        <p>For what we aspire</p>

        <h2>Login</h2>

        <form>

            <!-- Username / Email -->
            <label for="email">Username or Email:</label>
            <br>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <br><br>

            <!-- Password -->
            <label for="password">Password:</label>
            <br>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <br><br>

            <!-- Login Button -->
            <button type="submit">Login</button>

            <br><br>

            <!-- Forgot Password -->
            <a href="#">Forgot Password?</a>

            <br><br>

            <!-- Sign Up -->
            <p>
                Don't have an account?
                <a href="#">Sign Up</a>
            </p>

        </form>

    </main>

</body>

</html>
